<html>
    <head>
        <title>Legacy</title>
        <link rel="stylesheet" href="styles.css">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Inter">
        <meta name="viewport" content="width=device-width, initial-scale=1">
    </head>
    <body>
        <div class="login--body">
            <div class="padding">
            </div>
            <div class="login--content">
                <img class="logo" src="img/login_logo.svg">
                <div class="group--text--field">
                    <div class="text--field--label">
                        <p class="secondary">Login</p>
                        <div class="text--field">
                            <input placeholder="E-mail ou nome do usuário">
                        </div>
                    </div>
                    <div class="text--field--label">
                        <p class="secondary">Senha</p>
                        <div class="text--field">
                            <input placeholder="Senha">
                            <img class="icon size-s" src="img/icon_contrast_60/hide.svg">
                        </div>
                    </div>
                    <p class="link">Esqueceu suas credenciais?</p>
                </div>
                <div class="group--button">
                    <a href="dashboard.html">
                        <button class="button primary">
                            <p>Entrar</p>
                        </button>
                    </a>
                    <a>
                        <button class="button secondary">
                            <img class="icon size-s" src="img/icon_primary_text/new_user.svg">
                            <p>Solicitar acesso</p>
                        </button>
                    </a>
                </div>
            </div>
        </div>
        <script src="app.js"></script>
    </body>
</html>
