<html>

        <link rel="stylesheet" href="styles.css">

                            <img class="icon" src="img/icon_contrast_60/menu_dashboard.svg">

                        </div>
                        <div class="nav--lateral--tab--header--sub">
                            <img class="icon size-s" src="img/icon_contrast_60/expanded.svg">

                    </div>
                    <a href="dashboard.html" class="nav--lateral--tab--option">
                        <p>Tarefas</p>
                    </a>
                    <a href="prioridade.html" class="nav--lateral--tab--option">
                        <p>Prioridades</p>
                    </a>
                    <a href="link.html" class="nav--lateral--tab--option">
                        <p>Links</p>
                    </a>
                </div>
                <div class="nav--lateral--tab">
                    <div class="nav--lateral--tab--header">
                        <div class="nav--lateral--tab--header--sub">
                            <img class="icon" src="img/icon_contrast_60/menu_cadastro.svg">
                            <p class="secondary">Cadastro</p>
                        </div>
                        <div class="nav--lateral--tab--header--sub">
                            <img class="icon size-s" src="img/icon_contrast_60/expanded.svg">

                    </div>
                    <a href="cadastro.html" class="nav--lateral--tab--option">
                        <p>Score</p>
                    </a>
                </div>
                <div class="nav--lateral--tab">

                        <div class="nav--lateral--tab--header--sub">
                            <img class="icon" src="img/icon_contrast_60/menu_configuracoes.svg">
                            <p class="secondary">Configurações</p>
                        </div>
                        <div class="nav--lateral--tab--header--sub">
                            <img class="icon size-s" src="img/icon_contrast_60/expanded.svg">
                        </div>
                    </div>
                    <a class="nav--lateral--tab--option">
                        <p>Usuários</p>
                    </a>
                </div>
            </div>

            <div class="login--padding">
            </div>
            <div class="login--content">
                <img class="logo" src="img/login_logo.svg">
                <div class="group--text--field">
                    <div class="text--field--label">
                        <p class="secondary">Login</p>
                        <div class="text--field">
                            <input placeholder="E-mail ou nome do usuário">
                        </div>
                    </div>
                    <div class="text--field--label">
                        <p class="secondary">Senha</p>
                        <div class="text--field">
                            <input placeholder="Senha">
                            <img class="icon size-s" src="img/icon_contrast_60/hide.svg">
                        </div>
                    </div>
                    <p class="link">Esqueceu suas credenciais?</p>
                </div>
                <div class="group--button">
                    <a onclick="lateralNavOpen()"><div class="button button--primary">
                        <p>Entrar</p>
                    </div></a>
                    <div class="button button--secondary">
                        <img class="icon size-s" src="img/icon_primary_text/new_user.svg">
                        <p>Solicitar acesso</p>
                    </div>
                </div>
            </div>
