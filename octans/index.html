<html>
    <head>
        <title>Octans</title>
        <link rel="stylesheet" href="styles.css">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Inter">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&icon_names=arrow_drop_down,arrow_drop_up">
        <meta name="viewport" content="width=device-width, initial-scale=1">
    </head>
    <body>
        <div class="login--body">
            <div class="login--card">
                <div class="login--card--header">
                    <img class="logo" src="img/login_logo.svg">
                </div>
                <div class="login--card--body">
                    <h2>Entrar</h2>
                    <div class="group--text--field">
                        <div class="text--field--label">
                            <p class="secondary">Login</p>
                            <div class="text--field">
                                <input placeholder="E-mail ou nome do usuário">
                            </div>
                        </div>
                        <div class="text--field--label">
                            <p class="secondary">Senha</p>
                            <div class="text--field">
                                <input placeholder="Senha">
                                <i class="icon secondary" data-feather="eye-off"></i>
                            </div>
                        </div>
                    </div>
                    <a class="button primary" href="produtos.html">
                        <p>Entrar</p>
                    </a>
                    <a href="">
                        <p class="link">Esqueci minha senha</p>
                    </a>
                </div>
            </div>
        </div>
        <script src="https://unpkg.com/feather-icons"></script>
        <script src="https://unpkg.com/lucide@latest"></script>
        <script src="app.js"></script>
    </body>
</html>
