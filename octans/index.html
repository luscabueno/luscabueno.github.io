<html>
    <head>
        <title>Octans</title>
        <link rel="stylesheet" href="styles.css">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Inter">
        <meta name="viewport" content="width=device-width, initial-scale=1">
    </head>
    <body>
        <div class="login--body">
            <div class="login--card">
                <div class="login--card--header">
                    <img class="logo" src="img/login_logo.svg">
                </div>
                <div class="login--card--body">
                    <h2>Entrar</h2>
                    <div class="group--text--field">
                        <div class="text--field--label">
                            <p class="secondary">Login</p>
                            <div class="text--field">
                                <input placeholder="E-mail ou nome do usuário">
                            </div>
                        </div>
                        <div class="text--field--label">
                            <p class="secondary">Senha</p>
                            <div class="text--field">
                                <input placeholder="Senha">
                                <img src="img/icon_contrast_60/hide.svg" class="icon-s">
                            </div>
                        </div>
                    </div>
                    <a href="producao.html"><div class="button primary">
                        <p>Entrar</p>
                    </div></a>
                    <p class="link">Esqueci minha senha</p>
                </div>
            </div>
        </div>
        <script src="app.js"></script>
    </body>
</html>
