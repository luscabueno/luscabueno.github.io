<html>
    <head>
        <title>Test</title>
        <link rel="stylesheet" href="styles.css">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Inter">
        <meta name="viewport" content="width=device-width, initial-scale=1">
    </head>
    <body>
        <div class="login" background->
            <div class="login--sub login--sub--logo">
            </div>
            <div class="login--sub">
                <img src="img/login_logo.svg" class="logo">
                <div class="group--text--field">
                    <div class="text--field--label">
                        <p class="secondary">Login</p>
                        <div class="text--field">
                            <input placeholder="E-mail ou nome do usuário">
                        </div>
                    </div>
                    <div class="text--field--label">
                        <p class="secondary">Senha</p>
                        <div class="text--field">
                            <input placeholder="Senha">
                            <img src="img/icon_contrast_60/hide.svg" class="icon--small">
                        </div>
                    </div>
                    <p class="center link">Esqueceu suas credenciais?</p>
                </div>
                <div class="group--button">
                    <div class="button button--primary">
                        <p>Entrar</p>
                    </div>
                    <div class="button button--secondary">
                        <img src="img/icon_primary_text/new_user.svg" class="icon--small">
                        <p>Solicitar acesso</p>
                    </div>
                </div>
            </div>
        </div>
        <script src="app.js"></script>
    </body>
</html>
