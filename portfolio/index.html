<html>
    <head>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@400..800&display=swap">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=add,add_2,arrow_outward,close,menu">
        <link rel="stylesheet" href="css/styles.css">
        <meta name="viewport" content="width=device-width, initial-scale=1">
    </head>
    <body class="projects">
        <header>
            <div class="title">
                <div class="avatar"></div>
            </div>
            <div class="menu">
                <a href="" class="active">
                    <p class="secondary">01</p>
                    <p>PROJECTS</p>
                </a>
                <a href="" class="active">
                    <p class="secondary">02</p>
                    <p>SKILLS</p>
                </a>
                <a href="">
                    <p class="secondary">03</p>
                    <p>CONTACT</p>
                </a>
            </div>
            <button>
                <span class="material-symbols-outlined">menu</span>
            </button>
        </header>
        <div class="content"></div>

        <!-- project dialog -->

        <dialog class="project">
            <header>
                <div class="tags"></div>
                <button class="icon close-dialog">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </header>
            <div class="content">
                <div>
                    <div>
                        <p class="title"></p>
                        <p class="description secondary"></p>
                    </div>
                </div>
                <div class="gallery"></div>
            </div>
        </dialog>

        <!-- templates -->

        <template id="template-project-card">
            <div class="card">
                <img class="cover" src="img/projects/catavolt/catavolt_1.jpg">
                <div class="information">
                    <div class="tags"></div>
                    <div class="text">
                        <p class="title"></p>
                        <p class="description secondary"></p>
                    </div>
                    <button class="show-project-dialog">
                        <p>DETALHES</p>
                        <span class="icon material-symbols-outlined">arrow_outward</span>
                    </button>
                </div>
            </div>
        </template>

    </body>
    <script src="js/main.js"></script>
</html>
